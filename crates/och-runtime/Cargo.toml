[package]
name = "och-runtime"
description = "Bounded durable active-journal runtime for OpenControl Historian"
readme = "../../README.md"
keywords = ["historian", "industrial", "opencontrol"]
categories = ["asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
m03-pr03e-native-harness = ["och-store/m03-pr03e-native-harness"]

[package.metadata.och]
role = "native"
unsafe-policy = "forbid"
missing-docs-policy = "deny"

[dependencies]
och-core = { version = "=0.0.0", path = "../och-core" }
och-store = { version = "=0.0.0", path = "../och-store" }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync"] }

[lints]
workspace = true
