[package]
name = "och-v2-evidence"
description = "Private bounded-resource evidence tool for unchanged Native Segment V1 bytes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.och]
role = "tooling"

[dependencies]
och-core = { version = "=0.0.0", path = "../../crates/och-core" }
och-runtime = { version = "=0.0.0", path = "../../crates/och-runtime", default-features = false, features = ["m03-pr03e-native-harness"] }
och-store = { version = "=0.0.0", path = "../../crates/och-store" }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync"] }

[lints]
workspace = true
