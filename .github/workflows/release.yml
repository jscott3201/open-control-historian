name: Release-cycle gate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-linux:
    name: Full Linux release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Install pinned prebuilt Cargo tools
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2, resolved 2026-08-29
        with:
          tool: cargo-nextest@0.9.143,cargo-deny@0.20.2
          fallback: none
      - name: Run the canonical release gate
        run: ./scripts/gate.sh release
      - name: Preserve measured baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-baseline-linux
          path: target/baseline/baseline.txt
          if-no-files-found: error
