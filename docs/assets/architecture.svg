<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="architecture-title architecture-description" preserveAspectRatio="xMidYMid meet">
  <title id="architecture-title">OpenControl Historian current and future architecture boundaries</title>
  <desc id="architecture-description">A solid current native product boundary contains och-runtime, och-store, and och-core. Solid arrows show och-runtime depending on och-store, och-store depending on och-core, and runtime using canonical core types directly. Tokio is the runtime's only allowed external product dependency with rt and sync features. Dashed boxes place repository tooling, absent future adapters, and the unimplemented Store Format V2 review contract outside the current product boundary.</desc>
  <defs>
    <marker id="arrow-current" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrow-future" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #111111; }
      .section { font: 700 23px system-ui, sans-serif; fill: #111111; }
      .box-title { font: 700 24px system-ui, sans-serif; fill: #111111; }
      .body { font: 18px system-ui, sans-serif; fill: #111111; }
      .small { font: 16px system-ui, sans-serif; fill: #111111; }
      .current-box { fill: #ffffff; stroke: #111111; stroke-width: 3; }
      .native-boundary { fill: #f7f7f7; stroke: #111111; stroke-width: 4; }
      .outside-box { fill: #ffffff; stroke: #111111; stroke-width: 3; stroke-dasharray: 12 8; }
      .current-line { fill: none; stroke: #111111; stroke-width: 4; marker-end: url(#arrow-current); }
      .future-line { fill: none; stroke: #111111; stroke-width: 4; stroke-dasharray: 12 8; marker-end: url(#arrow-future); }
    </style>
  </defs>

  <text x="60" y="48" class="title">OpenControl Historian architecture</text>

  <line x1="65" y1="84" x2="155" y2="84" stroke="#111111" stroke-width="4"/>
  <text x="170" y="90" class="body">Solid = current product boundary or dependency</text>
  <line x1="655" y1="84" x2="745" y2="84" stroke="#111111" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="760" y="90" class="body">Dashed = future or non-product tooling</text>

  <rect x="30" y="120" width="1140" height="420" rx="18" class="native-boundary"/>
  <text x="55" y="158" class="section">Current native product boundary (default members)</text>

  <rect x="65" y="195" width="300" height="245" rx="12" class="current-box"/>
  <text x="85" y="232" class="box-title">och-runtime</text>
  <text x="85" y="270" class="body">Bounded ingress</text>
  <text x="85" y="300" class="body">Sole blocking writer</text>
  <text x="85" y="330" class="body">Handled/durable receipts</text>
  <text x="85" y="360" class="body">Volatile latest observations</text>
  <text x="85" y="405" class="small">Latest restarts empty; no</text>
  <text x="85" y="428" class="small">current/held-value implication</text>

  <rect x="450" y="195" width="300" height="245" rx="12" class="current-box"/>
  <text x="470" y="232" class="box-title">och-store</text>
  <text x="470" y="270" class="body">Store Format V1</text>
  <text x="470" y="300" class="body">Journal + Manifest</text>
  <text x="470" y="330" class="body">Recovery + raw seals</text>
  <text x="470" y="360" class="body">Read-only Native Segment V1</text>
  <text x="470" y="390" class="body">candidate/query</text>
  <text x="470" y="425" class="small">Offline and non-authorizing</text>

  <rect x="835" y="195" width="300" height="245" rx="12" class="current-box"/>
  <text x="855" y="232" class="box-title">och-core</text>
  <text x="855" y="270" class="body">Canonical model</text>
  <text x="855" y="300" class="body">Declaration lifecycle</text>
  <text x="855" y="330" class="body">Admission authority</text>
  <text x="855" y="360" class="body">Retry comparison</text>
  <text x="855" y="405" class="small">Dependency-free semantic</text>
  <text x="855" y="428" class="small">authority</text>

  <path d="M 365 305 L 450 305" class="current-line"/>
  <text x="375" y="286" class="small">depends on</text>
  <path d="M 750 305 L 835 305" class="current-line"/>
  <text x="760" y="286" class="small">depends on</text>
  <path d="M 350 405 C 520 510, 745 510, 850 425" class="current-line"/>
  <text x="465" y="510" class="small">runtime uses canonical core types directly</text>

  <rect x="65" y="590" width="300" height="125" rx="12" class="current-box"/>
  <text x="85" y="625" class="box-title">Tokio</text>
  <text x="85" y="658" class="body">Runtime's only allowed external</text>
  <text x="85" y="688" class="body">product dependency: rt + sync only</text>
  <path d="M 215 440 L 215 590" class="current-line"/>
  <text x="230" y="565" class="small">direct runtime edge</text>

  <rect x="450" y="590" width="300" height="125" rx="12" class="outside-box"/>
  <text x="470" y="625" class="box-title">Repository tooling</text>
  <text x="470" y="658" class="body">och-policy / och-v2-evidence</text>
  <text x="470" y="688" class="body">Outside native/default members</text>

  <rect x="835" y="590" width="300" height="125" rx="12" class="outside-box"/>
  <text x="855" y="625" class="box-title">Future adapters</text>
  <text x="855" y="658" class="body">Absent today</text>
  <text x="855" y="688" class="body">Allowed direction: adapter → native</text>
  <path d="M 1060 590 L 1060 440" class="future-line"/>
  <text x="930" y="565" class="small">future inward edge only</text>

  <rect x="65" y="765" width="1070" height="95" rx="12" class="outside-box"/>
  <text x="85" y="802" class="box-title">Store Format V2</text>
  <text x="335" y="802" class="body">Outside the current product boundary: review contract only</text>
  <text x="85" y="837" class="body">Not implemented; no accepted/emitted V2 product bytes or runtime Native Segment publication</text>
</svg>
